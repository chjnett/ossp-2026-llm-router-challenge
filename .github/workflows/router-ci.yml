# RULES C5·E9. 사람이 기억하는 규칙은 언젠가 깨진다.
#
# 실제로 세 번 깨졌다. 헤드 버전을 올리고 산출물을 다시 굽지 않아 런타임이
# 조용히 all-light로 떨어졌는데, 폴백도 유효한 제출을 만들어서 형식 검사로는
# 안 잡혔다. 그래서 산출물-코드 정합성을 CI에서 매번 확인한다.
#
# 파산 게이트는 무거워서(설정당 약 2분) 여기서 짧은 판(400회)만 돌린다.
# 챔피언 승격에 쓰는 N=2000 판정은 여전히 손으로 돌린다.

name: router-ci

on:
  push:
    branches: [main, router-dev]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy ruff "reuse[charset-normalizer]"

      - name: ruff
        run: ruff check .

      - name: reuse lint
        run: reuse lint

      - name: 공개 자료 생성
        run: |
          python -m pip install -r data/sources/requirements-materialize-public-data.txt
          python tools/materialize_public_data.py

      - name: 표준 라이브러리 테스트
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'

      - name: 산출물과 코드 정합성
        run: |
          PYTHONPATH=src python - <<'PY'
          from ossp_router.protocol import load_bundled_policy
          from router.artifact import load_artifact, restore
          from router.cli import ARTIFACT_PATH
          restore(load_artifact(ARTIFACT_PATH), load_bundled_policy())
          print("산출물과 코드가 맞물린다")
          PY

      - name: 챔피언 설정으로 파산 게이트 짧은 판
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, pathlib, sys
          from router.data import budget_multipliers, load_dataset, TIERS
          from router.features import family_codes
          from router.pipeline import Config, run_on_split
          from router.stress import gate_passed, run_gate

          champion = json.loads(pathlib.Path("experiments/champion.json").read_text())
          config = Config(**champion["config"])
          train, dev = load_dataset("train"), load_dataset("dev")
          evaluation, prediction, _ = run_on_split(config, train, dev)
          results = run_gate(
              dev, prediction.s_hat, prediction.c_hat,
              family=family_codes(dev.texts), util=config.util,
              multipliers=budget_multipliers(dev.policy),
              allow=prediction.allow, sd=prediction.sd, mu=config.mu,
              trials=400, size_penalty=config.size_penalty,
              headroom=config.headroom, epsilon=config.epsilon,
          )
          failures = sum(r.tiers[t].failures for r in results for t in TIERS)
          print(evaluation)
          print(f"파산 {failures}회 (400회 판)")
          sys.exit(0 if gate_passed(results) else 1)
          PY

  # 제출은 커밋 SHA와 이미지 다이제스트를 나란히 적을 뿐, 둘이 실제로 맞물리는지는
  # 공식 검증기도 확인하지 않는다. 형식만 본다. 산출물이 낡아 런타임이 조용히
  # all-light로 떨어진 사고를 세 번 겪었고, 같은 부류다. 매 push마다 확인한다.
  #
  # arm64 러너를 쓴다. 처음에는 "내용 검증은 플랫폼과 무관하니 amd64에서 네이티브로
  # 굽자"고 했는데 틀렸다. 검사는 플랫폼과 무관하지만 **빌드가 아니다.**
  # container/router-requirements.txt는 numpy wheel의 SHA-256을 고정하는데 그 wheel은
  # aarch64용이라, amd64 러너에서는 pip가 x86_64 wheel을 받아 해시가 어긋난다.
  # 기반 이미지도 arm64 다이제스트로 고정돼 있다.
  #
  # ubuntu-24.04-arm은 공개 저장소에 무료이고 네이티브라 QEMU도 필요 없다.
  # 여기서 굽는 것이 실제로 제출될 물건과 같은 플랫폼이다.
  image-binding:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify_release가 커밋을 git archive로 펼친다

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -r data/sources/requirements-materialize-public-data.txt
          python tools/materialize_public_data.py

      # --rebuild는 쓰지 않는다. 산출물을 다시 구우면 provenance의 커밋과
      # 시각이 바뀌어 작업 트리가 더러워지고, 그 상태로 구운 이미지는 커밋과
      # 어긋난다. 여기서는 **체크아웃한 그대로**를 굽는다. 그것이 제출될
      # 물건이다. 산출물이 낡았는지는 아래 두 검사가 잡는다.
      - name: 커밋 그대로 이미지 빌드
        run: |
          MANIFEST="$(PYTHONPATH=src python tools/benchmark_runtime.py \
            --print-source-manifest-sha256)"
          docker build --platform linux/arm64 --provenance=false --sbom=false \
            --build-arg "SOURCE_MANIFEST_SHA256=$MANIFEST" \
            --file container/router.Dockerfile --tag ossp-router:verify .

      - name: 전 스택 검증 (호스트-컨테이너 일치, ID·순서 감사, 공식 채점기)
        run: PYTHONPATH=src python tools/verify_submission_stack.py

      - name: 이미지가 이 커밋의 코드를 담고 있는가
        run: |
          PYTHONPATH=src python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import verify_release as release

          # 레지스트리가 없으므로 다이제스트에 기대는 검사는 건너뛰고,
          # 이 워크플로가 실제로 지키려는 것만 본다.
          submission = {"commit_sha": release._run(
              ["git", "rev-parse", "HEAD"], cwd=release.ROOT).strip(),
              "image_digest": "ossp-router:verify"}
          for name, check in (
              ("이미지가 그 커밋의 코드를 담고 있다", release.check_image_carries_the_commit),
              ("이미지 안 산출물이 낡지 않았다", release.check_artifact_is_not_stale),
              ("이미지에 VOLUME 선언이 없다", release.check_no_declared_volume),
          ):
              try:
                  print(f"✓ {name} — {check(submission)}")
              except release.Failed as exc:
                  print(f"✗ {name}\n  {exc}")
                  raise SystemExit(1)
          PY
